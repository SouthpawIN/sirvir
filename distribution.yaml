name: sirvir
description: Local-only Turbofit installation, configuration, usage, troubleshooting, and contribution support
version: "2.1.0"
author: SouthpawIN
license: MIT
homepage: https://github.com/SouthpawIN/sirvir
repo: https://github.com/SouthpawIN/sirvir
hermes_requires: ">=0.12.0"

dependencies:
  - name: turbofit
    repo: SouthpawIN/turbofit
    install: "hermes plugins install --enable https://github.com/SouthpawIN/turbofit.git"
    required: true

distribution_owned:
  - README.md
  - SOUL.md
  - AGENTS.md
  - config.yaml
  - distribution.yaml
  - skills/sirvir/

post_install:
  - command: 'echo "Sirvir installed. Start with: hermes -p sirvir"'
    description: Display local support-profile usage
