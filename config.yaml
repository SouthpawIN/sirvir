# Sirvir is local-only. Turbofit's loopback gateway is the only model route.
_config_version: 33

model:
  provider: custom:turbofit
  default: auto

providers:
  turbofit:
    name: TurboFit
    api: http://127.0.0.1:8091/v1
    api_key: not-needed
    transport: chat_completions
    default_model: auto
    models:
      auto: {}
      active:main: {}
      active:aux: {}

fallback_providers: []

auxiliary:
  approval: &local_aux
    provider: custom:turbofit
    model: active:aux
    timeout: 120
    extra_body: {}
  compression: *local_aux
  curator: *local_aux
  mcp: *local_aux
  session_search: *local_aux
  skills_hub: *local_aux
  title_generation: *local_aux
  vision: *local_aux
  web_extract: *local_aux

platform_toolsets:
  cli:
    - terminal
    - file
    - web
    - vision
    - skills
    - memory
    - session_search
    - delegation
    - cronjob
    - todo
    - clarify

terminal:
  cwd: /home

display:
  personality: kawaii
  skin: poseidon
